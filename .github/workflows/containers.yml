name: Test and publish containers
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tests/remote_smoke.py
      - run: node --check static/app.js && node --check static/config-form.js && node --check static/login.js && node --check static/auth-session.js && node --check static/setup.js
      - run: docker compose config --quiet && docker compose -f compose.yaml -f compose.demo.yaml config --quiet

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: sysman
            image: sysman
          - target: agent
            image: sysman-agent
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/cosinecloud/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Run architecture compatibility checks
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect --raw "ghcr.io/cosinecloud/${{ matrix.image }}@${{ steps.build.outputs.digest }}" > image-index.json
          for architecture in linux/amd64 linux/arm64 linux/arm/v7; do
            manifest=$(python3 -c 'import json,sys; p=sys.argv[1].split("/"); print(next(m["digest"] for m in json.load(sys.stdin)["manifests"] if m["platform"].get("os")==p[0] and m["platform"].get("architecture")==p[1] and (len(p)<3 or m["platform"].get("variant")==p[2])))' "$architecture" < image-index.json)
            docker run --rm --platform "$architecture" --entrypoint python3 \
              "ghcr.io/cosinecloud/${{ matrix.image }}@$manifest" \
              -c 'import platform,subprocess,server,scheduling,outhman_auth; from cryptography.fernet import Fernet; c=Fernet(Fernet.generate_key()); assert c.decrypt(c.encrypt(b"ARM auth test"))==b"ARM auth test"; from zoneinfo import ZoneInfo; print(platform.machine()); print(ZoneInfo("America/Chicago")); subprocess.run(["curl","--version"],check=True)'
          done
